name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

# Cancel superseded runs for the same ref (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: coverage run -m pytest && coverage report --fail-under=80
      - uses: azure/setup-helm@v4
      - run: helm lint charts/sre-foresight

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR (push/tag events only)
      id-token: write        # provenance attestation
      attestations: write    # provenance attestation
    steps:
      - uses: actions/checkout@v7
      # QEMU is only needed for the multi-arch build we publish on push.
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ngatia/sre-foresight
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # On PRs: build amd64 only and do NOT push, just to validate the image
          # builds. On push/tags: build multi-arch and publish to GHCR.
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
