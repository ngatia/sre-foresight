# Copy to config/slos.yaml and edit. Every metric_query is treated as a
# good-ratio SLI: a PromQL query returning a value in [0,1] (the fraction of
# events that were "good"). This holds for BOTH availability and latency SLOs.
#
# For a latency SLO, express it as a RATIO query - the fraction of requests
# served faster than your threshold - NOT as a raw latency value. Example:
#   sum(rate(http_request_duration_seconds_bucket{le="0.5"}[5m]))
#     / sum(rate(http_request_duration_seconds_count[5m]))
# returns the fraction of requests under 500ms, in [0,1].
#
# threshold_seconds is OPTIONAL and purely advisory/display metadata; v1 does
# NOT compare any query against it. Keep the threshold inside the ratio query.
#
# window_days is the SLO horizon: the remaining error budget is computed over
# this full span (a server-side avg_over_time subquery). See README "How it
# works".
slos:
  - name: "Example - Availability"
    service: "example"
    target_percent: 99.0
    window_days: 30
    metric_query: "avg_over_time(probe_success{instance='https://example.com'}[5m])"
    alert_thresholds:
      warning_burn_rate: 2.0
      critical_burn_rate: 10.0

  - name: "Example - Latency (ratio of requests under 500ms)"
    service: "example"
    target_percent: 99.0
    window_days: 30
    threshold_seconds: 0.5  # advisory only; the threshold lives in the query below
    metric_query: >-
      sum(rate(http_request_duration_seconds_bucket{le="0.5"}[5m]))
      / sum(rate(http_request_duration_seconds_count[5m]))
    alert_thresholds:
      warning_burn_rate: 2.0
      critical_burn_rate: 10.0
