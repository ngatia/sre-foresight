[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-foresight"
version = "0.1.0"
description = "Forecast SLO error-budget exhaustion and correlate burn spikes to their cause."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "coverage>=7.5",
    "ruff>=0.5",
]
kubernetes = ["kubernetes-asyncio>=30.0"]

# This is an application (run via docker/uvicorn), not an importable library.
# `pip install -e ".[dev]"` exists only to install dependencies for CI/dev;
# tests import the flat-layout modules via pytest's `pythonpath = ["."]`.
# Declaring no packages disables setuptools flat-layout auto-discovery, which
# otherwise fails with "Multiple top-level packages discovered".
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
